name: Validate Dreamztree app

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - main

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile application modules
        run: |
          python -m py_compile app.py ai_features.py intelligence_dashboard.py
